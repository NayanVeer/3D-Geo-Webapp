<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pune 3D Buildings Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map"></div>

  <!-- Top Search Bar -->
  <div id="search-container">
    <input type="text" id="search-input" placeholder="Search location...">
    <input type="text" id="keyword-input" placeholder="What are you looking for? e.g. temple, hospital">
    <button id="nearby-btn">🔍 Nearby</button>
    <button id="history-btn">📜 History</button>
    <button id="journey-button" class="journey-btn">🚗 Start Journey</button>
    <button id="exit-journey-button" class="journey-btn" style="display:none;">✖ Exit Journey</button>
  </div>
  </div>

  <!-- 🧠 Sidebar: History Panel -->
  <div id="history-panel" style="display: none;">
    <h3 id="hist-title"></h3>
    <img 
      id="hist-img"
      alt="Historical image of the selected location"
      title="Historical image"
      style="max-width: 100%; display: none;"
    >
    <p id="hist-text"></p>
    <a id="hist-link" target="_blank" rel="noopener noreferrer">Read more →</a>
  </div>

  <!-- Floating Controls -->
  <div id="floating-buttons">
    <button onclick="toggleBasemapPanel()">🗺️ Basemap</button>
    <button onclick="toggle3DBuildings()">🏙️ 3D</button>
  </div>

  <!-- Basemap Panel -->
  <div id="basemapPanel">
    <strong>Basemaps:</strong><br>
    <button onclick="changeBasemap('osm')">OSM</button>
    <button onclick="changeBasemap('carto')">Carto</button>
    <button onclick="changeBasemap('esri')">ESRI</button>
  </div>

  <!-- Time & Shadow Controls -->
  <div id="controls">
    <label for="time">Time: <span id="timeLabel"></span></label><br>
    <input type="range" id="time" min="0" max="23" value="12"><br>
    <label for="date">Day: <span id="dateLabel"></span></label><br>
    <input type="range" id="date" min="1" max="365" value="180">
  </div>
    <!-- 🚗 Journey Panel -->
  <div id="journey-panel" class="journey-panel" style="display:none;">
    <h3>Start Journey</h3>
    <label for="journey-start">Start Location:</label>
    <input id="journey-start" placeholder="Search or click map..." />

    <label for="journey-end">End Location:</label>
    <input id="journey-end" placeholder="Search or click map..." />

    <div style="margin-top:8px; display:flex; gap:8px;">
      <button id="journey-get">Get Route</button>
      <button id="journey-cancel">Cancel</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.osmbuildings.org/classic/0.2.2b/OSMBuildings-Leaflet.js"></script>
  <script src="app.js"></script>
  <script src="routing.js"></script>
</body>
</html>
