<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pune 3D Buildings Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🌍 Map -->
  <div id="map"></div>

  <!-- 📍 Left Side Panel -->
  <div class="left-panel">
    <!-- Top buttons -->
    <div class="left-panel__buttons">
      <button id="search-tab-btn" class="panel-tab-btn active">🔍 Search</button>
      <button id="nearby-tab-btn" class="panel-tab-btn">📍 Nearby</button>
      <button id="history-tab-btn" class="panel-tab-btn">📜 History</button>
      <button id="journey-tab-btn" class="panel-tab-btn">🚗 Journey</button>
    </div>

    <!-- Search Section -->
    <div id="search-section" class="panel-section active">
      <input type="text" id="search-input" placeholder="Search location...">
      <div id="results-list-container">
        <!-- results-list will be appended here -->
      </div>
    </div>

    <!-- Nearby Section -->
    <div id="nearby-section" class="panel-section">
      <input type="text" id="keyword-input" placeholder="e.g. temple, hospital, bus">
      <button id="nearby-btn" class="panel-action-btn">🔍 Search Nearby</button>
      <p class="panel-hint">Click on map or search a location first</p>
    </div>

    <!-- History Section -->
    <div id="history-section" class="panel-section">
      <div id="history-panel">
        <h3 id="hist-title">No history selected</h3>
        <img id="hist-img" alt="Historical image" style="max-width:100%; display:none;">
        <p id="hist-text">Search for a location to see its history.</p>
        <a id="hist-link" target="_blank" rel="noopener noreferrer" style="display:none;">Read more →</a>
      </div>
    </div>

    <!-- Journey Section -->
    <div id="journey-section" class="panel-section left-panel__journey">
      <h3>🗺️ Plan Your Journey</h3>

      <label for="journey-start">Start Location:</label>
      <input type="text" id="journey-start" placeholder="Search or click map...">

      <label for="journey-end">End Location:</label>
      <input type="text" id="journey-end" placeholder="Search or click map...">

      <label for="transport-mode">Transport Mode:</label>
      <select id="transport-mode" class="transport-select">
        <option value="car">🚗 Car</option>
        <option value="walking">🚶 Walking</option>
        <option value="bicycle">🚴 Bicycle</option>
        <option value="bus">🚌 Bus</option>
        <option value="rickshaw">🛺 Rickshaw</option>
        <option value="cycle">🚲 Cycle</option>
      </select>

      <div class="journey-actions">
        <button id="journey-get" class="panel-action-btn">Get Route</button>
        <button id="journey-clear" class="panel-action-btn secondary">Clear</button>
      </div>
      <small class="panel-hint">
        Tip: Click on a field, then click the map to set a point, or type to search.
      </small>
    </div>
  </div>

  <!-- 🧭 Top-Right Floating Controls (3D & Basemap) -->
  <div id="floating-buttons">
    <button onclick="toggle3DBuildings()" aria-label="Toggle 3D buildings">🏙️ 3D</button>
    <button onclick="toggleBasemapPanel()" aria-label="Change basemap">🗺️ Basemap</button>
  </div>

  <!-- Basemap Panel -->
  <div id="basemapPanel">
    <strong>Basemaps:</strong><br>
    <button onclick="changeBasemap('osm')">OSM</button>
    <button onclick="changeBasemap('carto')">Carto</button>
    <button onclick="changeBasemap('esri')">ESRI</button>
  </div>

  <!-- ☀️ Time & Shadow Controls -->
  <div id="controls">
    <label for="time">Time: <span id="timeLabel"></span></label><br>
    <input type="range" id="time" min="0" max="23" value="12"><br>
    <label for="date">Day: <span id="dateLabel"></span></label><br>
    <input type="range" id="date" min="1" max="365" value="180">
  </div>

  <!-- 🚦 Maneuvers Panel (for route instructions) -->
  <div id="maneuvers-panel" class="maneuvers-panel" style="display:none;">
    <h3>Directions</h3>
    <ol id="maneuvers-list"></ol>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.osmbuildings.org/classic/0.2.2b/OSMBuildings-Leaflet.js"></script>
  <script src="app.js"></script>
  <script src="routing.js"></script>

</body>
</html>
